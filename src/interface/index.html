<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robô</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

  <!-- ── Debug panel ── -->
  <div id="debug">
    <div class="debug-header">
      <span class="debug-tag">SYS</span>
      <span class="debug-title">BOT // LOG</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Câmera</span>
      <span class="debug-val" id="camera-status">aguardando...</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">WebSocket</span>
      <span class="debug-val" id="ws-status">desconectado</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Fala</span>
      <span class="debug-val" id="speak-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Ouvindo</span>
      <span class="debug-val" id="listen-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Vozes</span>
      <span class="debug-val" id="voices-status">carregando...</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Synth</span>
      <span class="debug-val" id="synth-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Estado</span>
      <span class="debug-val" id="bot-state">—</span>
    </div>
  </div>

  <!-- ── Robot face ── -->
  <div class="scene">

    <span class="name-tag">Robot</span>

    <div class="face" id="face">

      <!-- cheek blushes -->
      <div class="cheek cheek-l"></div>
      <div class="cheek cheek-r"></div>

      <!-- zzz floating above face (sleeping state) -->
      <div class="zzz-wrap">
        <span class="zzz zzz-1">z</span>
        <span class="zzz zzz-2">z</span>
        <span class="zzz zzz-3">Z</span>
      </div>

      <!-- eyes -->
      <div class="eyes">
        <div class="eye-socket">
          <div class="eye-iris">
            <div class="eye-pupil"></div>
            <div class="eye-gleam"></div>
          </div>
        </div>
        <div class="eye-socket">
          <div class="eye-iris">
            <div class="eye-pupil"></div>
            <div class="eye-gleam"></div>
          </div>
        </div>
      </div>

      <!-- mouth + overlays -->
      <div class="mouth-wrap">
        <div class="mouth"></div>

        <!-- spotify-style audio bars (speaking state) -->
        <div class="audio-bars">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>

        <div class="thought-bubble">
          <div class="thought-dot"></div>
          <div class="thought-dot"></div>
          <div class="thought-dot"></div>
        </div>
      </div>

    </div>

    <!-- greeting message, replaces old chat input area -->
    <span class="greeting-text" id="greeting-text">Diga "oi robô" para conversar</span>

    <!-- status dots + label -->
    <div class="status-bar">
      <div class="status-dot active"></div>
      <div class="status-dot active"></div>
      <div class="status-dot" id="status-dot-3"></div>
      <span class="state-label" id="state-label">◌ sleeping</span>
    </div>

  </div>

  <!-- ── Hidden media elements ── -->
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>

  <script type="module" src="/static/scripts/main.js"></script>

</body>

</html>
