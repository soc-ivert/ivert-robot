<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lobbybot</title>
  <!-- Google Fonts: Fredoka & Nunito for friendly rounded typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./static/style.css" />
</head>

<body>

  <!-- ── Debug Panel (Redesigned with project theme, toggleable) ── -->
  <div id="debug" style="display: none;">
    <div class="debug-header">
      <span class="debug-tag">SYS</span>
      <span class="debug-title">LOBBYBOT // MONITOR</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Câmera</span>
      <span class="debug-val" id="camera-status">aguardando...</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">WebSocket</span>
      <span class="debug-val" id="ws-status">desconectado</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Fala</span>
      <span class="debug-val" id="speak-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Ouvindo</span>
      <span class="debug-val" id="listen-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Estado</span>
      <span class="debug-val highlight" id="bot-state">SLEEPING</span>
    </div>
  </div>

  <!-- ── Main Stage / Scene ── -->
  <main class="stage state-sleeping" id="stage">
    <!-- Brand Logos -->
    <img class="brand-logo-top" src="./static/images/logo.png" alt="Logo IVERT" />
    <img class="brand-logo-bottom" src="./static/images/ivert-text.png" alt="IVERT" />

    <div class="robot-canvas-wrap">

      <!-- SVG Robot Vector Character -->
      <svg class="robot-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <!-- Visor clip path for screen effects (smooth arched corners, flat bottom at y=696) -->
          <clipPath id="visor-clip">
            <path d="M 700 696 L 1202 696 L 1202 676 C 1202 546 1088 450 951 450 C 814 450 700 546 700 676 Z" />
          </clipPath>
        </defs>

        <!-- 1. Antenna stalk & sphere -->
        <g id="antenna-group">
          <!-- Collar Base (Slight overlap downwards to y=376 to seamlessly merge into the dome curve) -->
          <path d="M 876 376 L 891 328 L 946.5 328 L 946.5 376 Z" fill="#dce0db" />
          <path d="M 946.5 328 L 1002 328 L 1017 376 L 946.5 376 Z" fill="#c3d3cc" />
          <!-- Neck Stem (Symmetric, centered at x=946.5, connecting seamlessly to sphere cx=946.5 cy=203.5) -->
          <!-- Left half in #dce0db, right half in #c3d3cc -->
          <path d="M 932 328 L 938 222 L 946.5 222 L 946.5 328 Z" fill="#dce0db" />
          <path d="M 946.5 328 L 946.5 222 L 955 222 L 961 328 Z" fill="#c3d3cc" />
          <!-- Sphere Shadow & Body (cx=946.5, cy=203.5, r=24) -->
          <circle cx="946.5" cy="203.5" r="24" fill="#c3d3cc" />
          <path
            d="M 946.5 179.5 A 24 24 0 0 0 922.5 203.5 A 24 24 0 0 0 946.5 227.5 A 24 24 0 0 0 954 226.3 C 938 215 938 190 954 180.7 A 24 24 0 0 0 946.5 179.5 Z"
            fill="#dce0db" />
          <!-- Sphere Glossy Highlight -->
          <circle cx="939" cy="197" r="6.5" fill="#ffffff" />
        </g>

        <!-- 2. Helmet Base Pedestal: Shadow trapezoid overlapping behind dome by 3px (y=715 to y=806) to eliminate sub-pixel gap -->
        <path id="helmet-base-shadow" d="M 611 716 L 680 806 L 1222 806 L 1291 716 Z" fill="#c3d3cc" />

        <!-- 3. Helmet Upper Dome (#dce0db) - solid primary body ending at y=718 -->
        <path id="helmet-dome"
          d="M 611 718 C 625 565 672 466 746 408 C 800 373 870 365 951 365 C 1032 365 1102 373 1156 408 C 1230 466 1277 565 1291 718 Z"
          fill="#dce0db" />

        <!-- 4. Helmet Top-Left Glossy Highlight (#ffffff) -->
        <path id="helmet-highlight"
          d="M 844 406 C 810 395 750 415 706 484 C 702 494 712 502 724 496 C 765 450 805 425 843 415 C 848 412 848 407 844 406 Z"
          fill="#ffffff" />

        <!-- 5. Dark Screen / Visor Cutout (#3c504b) - Bottom raised to y=696, leaving a clear primary body chin between 696 and 718 -->
        <path id="visor-bg" d="M 700 696 L 1202 696 L 1202 676 C 1202 546 1088 450 951 450 C 814 450 700 546 700 676 Z"
          fill="#3c504b" />

        <!-- 6. Visor Inner Top Shadow (#262b27) - Smooth curved shadow band inside top -->
        <path id="visor-shadow"
          d="M 700 676 C 700 546 814 450 951 450 C 1088 450 1202 546 1202 676 C 1173 554 1072 488 951 488 C 830 488 729 554 700 676 Z"
          fill="#262b27" />

        <!-- 7. Visor Screen Elements (Clipped inside screen) -->
        <g clip-path="url(#visor-clip)">

          <!-- 7a. Normal / Waiting / Speaking / Thinking Eyes -->
          <g id="eyes-group" class="eyes-container">
            <rect id="eye-left" class="robot-eye eye-left" x="815" y="558" width="60" height="85" rx="30" ry="30"
              fill="#00ab4f" />
            <rect id="eye-right" class="robot-eye eye-right" x="1019" y="558" width="60" height="85" rx="30" ry="30"
              fill="#00ab4f" />
          </g>

          <!-- 7b. Greeting Happy Eye Arcs -->
          <g id="greeting-eyes" class="greeting-eyes-container">
            <path class="greeting-arc arc-left" d="M 791 588 C 791 556 896 556 896 588" fill="none" stroke="#00ab4f"
              stroke-width="14" stroke-linecap="round" />
            <path class="greeting-arc arc-right" d="M 995 588 C 995 556 1100 556 1100 588" fill="none" stroke="#00ab4f"
              stroke-width="14" stroke-linecap="round" />
          </g>

          <!-- 7c. Sleeping ZZZ (alternating flow towards horizon) -->
          <g id="sleeping-zzz" class="sleeping-zzz-container">
            <g class="zzz-node zzz-n1">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central"
                fill="#00ab4f">Z</text>
            </g>
            <g class="zzz-node zzz-n2">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central"
                fill="#00ab4f">Z</text>
            </g>
            <g class="zzz-node zzz-n3">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central"
                fill="#00ab4f">Z</text>
            </g>
            <g class="zzz-node zzz-n4">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central"
                fill="#00ab4f">Z</text>
            </g>
          </g>

        </g>

        <!-- 8. Flower Accessory (Right Shoulder) -->
        <g id="flower-accessory">
          <!-- 6 Petals in #00ab4f -->
          <circle cx="1218" cy="463" r="33" fill="#00ab4f" />
          <circle cx="1196.5" cy="500.2" r="33" fill="#00ab4f" />
          <circle cx="1153.5" cy="500.2" r="33" fill="#00ab4f" />
          <circle cx="1132" cy="463" r="33" fill="#00ab4f" />
          <circle cx="1153.5" cy="425.8" r="33" fill="#00ab4f" />
          <circle cx="1196.5" cy="425.8" r="33" fill="#00ab4f" />
          <!-- Center in #1e621d -->
          <circle cx="1175" cy="463" r="26" fill="#1e621d" />
        </g>

        <!-- 9. Thought Bubble (Thinking State) -->
        <g id="thought-bubble" class="thought-bubble-container">
          <!-- Connection trail dots -->
          <circle class="bubble-dot dot-3" cx="708" cy="409" r="7" fill="#00ab4f" />
          <circle class="bubble-dot dot-2" cx="691" cy="391.5" r="9.5" fill="#00ab4f" />
          <circle class="bubble-dot dot-1" cx="668.5" cy="369.5" r="12.5" fill="#00ab4f" />
          <!-- Main Bubble Body -->
          <rect class="bubble-body" x="474" y="263" width="186" height="98" rx="24" fill="#00ab4f" />
          <!-- 3 Animated White Dots Inside -->
          <circle class="inner-dot idot-1" cx="527" cy="312" r="6.5" fill="#ffffff" />
          <circle class="inner-dot idot-2" cx="567" cy="312" r="6.5" fill="#ffffff" />
          <circle class="inner-dot idot-3" cx="607" cy="312" r="6.5" fill="#ffffff" />
        </g>

        <!-- 10. Speaking Audio Bars (Speaking State - 8 thick bars) -->
        <g id="speaking-bars" class="speaking-bars-container">
          <rect class="audio-bar bar-1" x="845" y="880" width="24" height="100" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-2" x="881" y="860" width="24" height="140" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-3" x="917" y="870" width="24" height="120" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-4" x="953" y="890" width="24" height="80" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-5" x="989" y="890" width="24" height="80" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-6" x="1025" y="870" width="24" height="120" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-7" x="1061" y="860" width="24" height="140" rx="12" fill="#00ab4f" />
          <rect class="audio-bar bar-8" x="1097" y="880" width="24" height="100" rx="12" fill="#00ab4f" />
        </g>

      </svg>

      <!-- ── Greeting Banner Pill (Bottom Text with bouncing letters) ── -->
      <div class="greeting-banner" id="greeting-banner">
        <span class="greeting-text" id="greeting-text">DIGA "OI ROBÔ" PARA CONVERSAR</span>
      </div>

    </div>
  </main>

  <!-- ── Hidden Media Elements (Preserved for Camera / Vision) ── -->
  <video id="video" autoplay playsinline muted style="display:none;"></video>
  <canvas id="canvas" style="display:none"></canvas>

  <script type="module" src="./static/scripts/main.js"></script>

</body>

</html>
