<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lobbybot</title>
  <!-- Google Fonts: Fredoka & Nunito for friendly rounded typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./static/style.css" />
</head>

<body>

  <!-- ── Debug Panel (Redesigned with project theme, toggleable) ── -->
  <div id="debug">
    <div class="debug-header">
      <span class="debug-tag">SYS</span>
      <span class="debug-title">LOBBYBOT // MONITOR</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Câmera</span>
      <span class="debug-val" id="camera-status">aguardando...</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">WebSocket</span>
      <span class="debug-val" id="ws-status">desconectado</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Fala</span>
      <span class="debug-val" id="speak-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Ouvindo</span>
      <span class="debug-val" id="listen-status">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-key">Estado</span>
      <span class="debug-val highlight" id="bot-state">SLEEPING</span>
    </div>
  </div>

  <!-- ── Main Stage / Scene ── -->
  <main class="stage state-sleeping" id="stage">
    <div class="robot-canvas-wrap">

      <!-- SVG Robot Vector Character -->
      <svg class="robot-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <!-- Visor clip path for screen effects -->
          <clipPath id="visor-clip">
            <path
              d="M 701 696 L 1201 696 C 1201 696 1201 580 1161 536 C 1114 478 1035 452 951 452 C 867 452 788 478 741 536 C 701 580 701 696 701 696 Z" />
          </clipPath>
        </defs>

        <!-- 1. Antenna stalk & sphere -->
        <g id="antenna-group">
          <!-- Collar Base -->
          <path d="M 879 365 L 887 330 L 952 330 L 953 366 Z" fill="#d5e9f2" />
          <path d="M 952 330 L 977 328 L 977 365 L 953 366 Z" fill="#a8d7e9" />
          <!-- Neck Stem -->
          <path d="M 921 330 C 923 270 933 240 933 230 L 960 229 C 960 240 951 270 951 330 Z" fill="#d5e9f2" />
          <!-- Sphere Shadow & Body -->
          <circle cx="946.5" cy="203.5" r="24" fill="#a8d7e9" />
          <path
            d="M 946.5 179.5 A 24 24 0 0 0 922.5 203.5 A 24 24 0 0 0 946.5 227.5 A 24 24 0 0 0 954 226.3 C 938 215 938 190 954 180.7 A 24 24 0 0 0 946.5 179.5 Z"
            fill="#d5e9f2" />
          <!-- Sphere Glossy Highlight -->
          <circle cx="939" cy="197" r="6.5" fill="#ffffff" />
        </g>

        <!-- 2. Helmet Base Pedestal & Side Shadows (#a8d7e9) -->
        <path id="helmet-base-shadow"
          d="M 611 718 L 680 806 L 1222 806 L 1291 717 C 1291 717 1278 611 1240 504 L 1206 540 C 1230 688 1205 719 1205 719 L 611 718 Z"
          fill="#a8d7e9" />

        <!-- 3. Helmet Upper Dome (#d5e9f2) -->
        <path id="helmet-dome"
          d="M 611 718 C 625 570 670 470 746 410 C 800 375 870 364 953 366 C 1036 364 1106 375 1160 410 C 1236 470 1281 570 1291 717 L 1205 719 C 1205 719 1225 670 1200 696 L 701 696 C 685 670 611 718 611 718 Z"
          fill="#d5e9f2" />

        <!-- 4. Helmet Top-Left Glossy Highlight (#ffffff) -->
        <path id="helmet-highlight"
          d="M 844 406 C 810 395 750 415 706 484 C 702 494 712 502 724 496 C 765 450 805 425 843 415 C 848 412 848 407 844 406 Z"
          fill="#ffffff" />

        <!-- 5. Dark Screen / Visor Cutout (#002b43) -->
        <path id="visor-bg"
          d="M 701 696 L 1201 696 C 1201 696 1201 580 1161 536 C 1114 478 1035 452 951 452 C 867 452 788 478 741 536 C 701 580 701 696 701 696 Z"
          fill="#002b43" />

        <!-- 6. Visor Inner Top Shadow (#000f16) -->
        <path id="visor-shadow"
          d="M 701 696 C 701 580 741 536 788 478 C 835 452 951 452 951 452 C 951 452 1067 452 1114 478 C 1161 536 1201 580 1201 696 C 1201 580 1140 500 1048 498 C 955 488 874 494 798 517 C 735 580 701 696 701 696 Z"
          fill="#000f16" />

        <!-- 7. Visor Screen Elements (Clipped inside screen) -->
        <g clip-path="url(#visor-clip)">

          <!-- 7a. Normal / Waiting / Speaking / Thinking Eyes -->
          <g id="eyes-group" class="eyes-container">
            <rect id="eye-left" class="robot-eye eye-left" x="815" y="558" width="60" height="85" rx="30" ry="30"
              fill="#38b6ff" />
            <rect id="eye-right" class="robot-eye eye-right" x="1019" y="558" width="60" height="85" rx="30" ry="30"
              fill="#38b6ff" />
          </g>

          <!-- 7b. Greeting Happy Eye Arcs -->
          <g id="greeting-eyes" class="greeting-eyes-container">
            <path class="greeting-arc arc-left" d="M 791 588 C 791 556 896 556 896 588" fill="none" stroke="#38b6ff"
              stroke-width="14" stroke-linecap="round" />
            <path class="greeting-arc arc-right" d="M 995 588 C 995 556 1100 556 1100 588" fill="none" stroke="#38b6ff"
              stroke-width="14" stroke-linecap="round" />
          </g>

          <!-- 7c. Sleeping ZZZ (alternating flow towards horizon) -->
          <g id="sleeping-zzz" class="sleeping-zzz-container">
            <g class="zzz-node zzz-n1">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#38b6ff">Z</text>
            </g>
            <g class="zzz-node zzz-n2">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#38b6ff">Z</text>
            </g>
            <g class="zzz-node zzz-n3">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#38b6ff">Z</text>
            </g>
            <g class="zzz-node zzz-n4">
              <text class="zzz-text" x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#38b6ff">Z</text>
            </g>
          </g>

        </g>

        <!-- 8. Flower Accessory (Right Shoulder) -->
        <g id="flower-accessory">
          <!-- 6 Petals in #38b6ff -->
          <circle cx="1218" cy="463" r="33" fill="#38b6ff" />
          <circle cx="1196.5" cy="500.2" r="33" fill="#38b6ff" />
          <circle cx="1153.5" cy="500.2" r="33" fill="#38b6ff" />
          <circle cx="1132" cy="463" r="33" fill="#38b6ff" />
          <circle cx="1153.5" cy="425.8" r="33" fill="#38b6ff" />
          <circle cx="1196.5" cy="425.8" r="33" fill="#38b6ff" />
          <!-- Center in #004aad -->
          <circle cx="1175" cy="463" r="26" fill="#004aad" />
        </g>

        <!-- 9. Thought Bubble (Thinking State) -->
        <g id="thought-bubble" class="thought-bubble-container">
          <!-- Connection trail dots -->
          <circle class="bubble-dot dot-3" cx="708" cy="409" r="7" fill="#38b6ff" />
          <circle class="bubble-dot dot-2" cx="691" cy="391.5" r="9.5" fill="#38b6ff" />
          <circle class="bubble-dot dot-1" cx="668.5" cy="369.5" r="12.5" fill="#38b6ff" />
          <!-- Main Bubble Body -->
          <rect class="bubble-body" x="474" y="263" width="186" height="98" rx="24" fill="#38b6ff" />
          <!-- 3 Animated White Dots Inside -->
          <circle class="inner-dot idot-1" cx="527" cy="312" r="6.5" fill="#ffffff" />
          <circle class="inner-dot idot-2" cx="567" cy="312" r="6.5" fill="#ffffff" />
          <circle class="inner-dot idot-3" cx="607" cy="312" r="6.5" fill="#ffffff" />
        </g>

        <!-- 10. Speaking Audio Bars (Speaking State - 8 thick bars) -->
        <g id="speaking-bars" class="speaking-bars-container">
          <rect class="audio-bar bar-1" x="845" y="880" width="24" height="100" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-2" x="881" y="860" width="24" height="140" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-3" x="917" y="870" width="24" height="120" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-4" x="953" y="890" width="24" height="80" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-5" x="989" y="890" width="24" height="80" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-6" x="1025" y="870" width="24" height="120" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-7" x="1061" y="860" width="24" height="140" rx="12" fill="#38b6ff" />
          <rect class="audio-bar bar-8" x="1097" y="880" width="24" height="100" rx="12" fill="#38b6ff" />
        </g>

      </svg>

      <!-- ── Greeting Banner Pill (Bottom Text with bouncing letters) ── -->
      <div class="greeting-banner" id="greeting-banner">
        <span class="greeting-text" id="greeting-text">DIGA "OI ROBÔ" PARA CONVERSAR</span>
      </div>

    </div>
  </main>

  <!-- ── Hidden Media Elements (Preserved for Camera / Vision) ── -->
  <video id="video" autoplay playsinline muted style="display:none;"></video>
  <canvas id="canvas" style="display:none"></canvas>

  <script type="module" src="./static/scripts/main.js"></script>

</body>

</html>
